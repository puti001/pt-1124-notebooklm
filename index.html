<!DOCTYPE html>
<html lang="zh-Hant" data-theme="warm">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Puti-AI | Gemini Notebook 減法工作術</title>
  <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <style>
    :root {
      --bg-body: #FFFDF9;
      --bg-card: #FFFFFF;
      --bg-soft: #FFF7EB;
      --primary: #FF9F1C;
      --secondary: #FFBF69;
      --accent: #2EC4B6;
      --accent-soft: #E6F9F7;
      --text: #332C2B;
      --muted: #726560;
      --border: #F2E3CE;
      --shadow: rgba(51, 44, 43, 0.09);
      --banner-gradient: linear-gradient(135deg, #FF9F1C 0%, #FFBF69 100%);
    }

    [data-theme="warm"] {
      --bg-body: #FFFDF9; --bg-soft: #FFF7EB; --primary: #FF9F1C; --secondary: #FFBF69;
      --accent: #2EC4B6; --accent-soft: #E6F9F7; --border: #F2E3CE;
      --banner-gradient: linear-gradient(135deg, #FF9F1C 0%, #FFBF69 100%);
    }
    [data-theme="professional"] {
      --bg-body: #F3F7FB; --bg-soft: #EBF3FA; --primary: #1B4965; --secondary: #62B6CB;
      --accent: #3D9970; --accent-soft: #E8F6EF; --border: #D5E4F0;
      --banner-gradient: linear-gradient(135deg, #1B4965 0%, #62B6CB 100%);
    }
    [data-theme="cute"] {
      --bg-body: #FFF6F9; --bg-soft: #FFEDF3; --primary: #FF7597; --secondary: #FBB1BD;
      --accent: #8B7CF6; --accent-soft: #F1EEFF; --border: #FAD6E1;
      --banner-gradient: linear-gradient(135deg, #FF7597 0%, #FBB1BD 100%);
    }
    [data-theme="earth"] {
      --bg-body: #F7F4EF; --bg-soft: #EFEAE1; --primary: #795548; --secondary: #A1887F;
      --accent: #558B2F; --accent-soft: #EDF5E6; --border: #E0D6C8;
      --banner-gradient: linear-gradient(135deg, #795548 0%, #A1887F 100%);
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      font-family: 'Zen Maru Gothic', 'Noto Sans TC', sans-serif;
      background-color: var(--bg-body);
      background-image: radial-gradient(var(--border) 1.2px, transparent 1.2px);
      background-size: 28px 28px;
      color: var(--text);
      letter-spacing: 0.04em;
      line-height: 1.7;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
      transition: background-color 0.3s ease;
    }

    /* Navbar */
    .navbar {
      position: sticky;
      top: 0;
      z-index: 50;
      background: rgba(255, 253, 249, 0.94);
      backdrop-filter: blur(12px);
      border-bottom: 1.5px solid var(--border);
      padding: 10px 20px;
    }
    .navbar-inner {
      max-width: 1240px;
      margin: 0 auto;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }
    .brand { display: flex; align-items: center; gap: 12px; }
    .brand-icon {
      width: 42px; height: 42px; border-radius: 15px;
      background: var(--banner-gradient); color: #fff;
      display: flex; align-items: center; justify-content: center;
      font-size: 1.3rem; box-shadow: 0 6px 14px var(--shadow); flex-shrink: 0;
    }
    .brand-title { font-size: 1.12rem; font-weight: 900; margin: 0; line-height: 1.25; }
    .brand-sub { font-size: 0.82rem; color: var(--muted); margin: 0; }
    .nav-actions { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }

    .theme-dots {
      display: inline-flex; align-items: center; gap: 6px;
      background: #fff; padding: 6px 10px; border-radius: 40px;
      border: 1.5px solid var(--border);
    }
    .theme-dot {
      width: 18px; height: 18px; border-radius: 50%; border: 2px solid #fff;
      cursor: pointer; box-shadow: 0 2px 5px rgba(0,0,0,0.18); transition: transform 0.2s;
    }
    .theme-dot:hover { transform: scale(1.2); }
    .theme-dot.active { outline: 2px solid var(--text); }

    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 7px;
      padding: 10px 18px; border-radius: 40px; border: none;
      font-family: inherit; font-size: 0.96rem; font-weight: 700;
      cursor: pointer; text-decoration: none;
      box-shadow: 0 6px 14px var(--shadow);
      transition: transform 0.18s ease, box-shadow 0.18s ease;
      max-width: 100%;
      white-space: normal;
      text-align: center;
      line-height: 1.35;
    }
    .btn:hover { transform: translateY(-2px); box-shadow: 0 8px 18px var(--shadow); }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }
    .btn-primary { background: var(--banner-gradient); color: #fff; }
    .btn-accent { background: var(--accent); color: #fff; }
    .btn-dark { background: var(--text); color: #fff; }
    .btn-soft { background: var(--bg-soft); color: var(--text); border: 1.5px solid var(--border); box-shadow: none; }
    .btn-white { background: #fff; color: var(--text); border: 1.5px solid var(--border); }
    .btn-sm { padding: 7px 14px; font-size: 0.88rem; }
    .btn-icon {
      width: 40px; height: 40px; padding: 0; border-radius: 50%;
      font-size: 1.05rem; flex-shrink: 0;
    }
    .btn-padlet { background: linear-gradient(135deg, #FF4081 0%, #FF79A8 100%); color: #fff; }

    /* Main Stage */
    main {
      flex: 1;
      width: 100%;
      max-width: 1200px;
      margin: 0 auto;
      padding: 20px 20px 32px;
      display: flex;
      flex-direction: column;
    }

    /* Slide Header Banner */
    .slide-shell {
      background: #fff;
      border-radius: 32px;
      border: 2px solid var(--border);
      box-shadow: 0 14px 40px var(--shadow);
      padding: 28px 34px 30px;
      display: flex;
      flex-direction: column;
      gap: 22px;
    }
    .slide-meta-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }
    .tag-pill {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 7px 18px; border-radius: 40px;
      font-size: 1rem; font-weight: 900;
      background: var(--bg-soft); color: var(--primary);
      border: 1.5px solid var(--border);
    }
    .tag-pill.s2 { background: var(--accent-soft); color: #0F766E; border-color: #B2EBF2; }
    .slide-progress {
      font-size: 1rem; font-weight: 900; color: var(--muted);
      background: var(--bg-soft); padding: 6px 16px; border-radius: 40px;
    }

    .slide-title {
      font-size: clamp(1.85rem, 3.4vw, 2.75rem);
      font-weight: 900;
      margin: 0;
      line-height: 1.3;
      color: var(--text);
    }
    .slide-quote {
      background: var(--bg-soft);
      border-left: 6px solid var(--primary);
      padding: 14px 22px;
      border-radius: 0 20px 20px 0;
      font-size: clamp(1.12rem, 1.8vw, 1.38rem);
      font-weight: 700;
      color: var(--text);
      margin: 0;
    }

    /* Mini Flip Cards Grid (BIG TEXT FOR 200-SEAT AUDITORIUM!) */
    .mini-cards-grid {
      display: grid;
      gap: 20px;
      margin-top: 4px;
    }
    .mini-cards-grid.cols-2 { grid-template-columns: repeat(2, 1fr); }
    .mini-cards-grid.cols-3 { grid-template-columns: repeat(3, 1fr); }
    .mini-cards-grid.cols-4 { grid-template-columns: repeat(2, 1fr); }

    .mini-card-wrap {
      perspective: 1200px;
      min-height: 270px;
      cursor: pointer;
    }
    .mini-cards-grid.cols-4 .mini-card-wrap {
      min-height: 220px;
    }
    .mini-card-inner {
      position: relative;
      width: 100%;
      height: 100%;
      min-height: inherit;
      transition: transform 0.6s cubic-bezier(0.22, 1, 0.36, 1);
      transform-style: preserve-3d;
    }
    .mini-card-wrap.flipped .mini-card-inner {
      transform: rotateY(180deg);
    }
    .mini-face {
      position: absolute;
      inset: 0;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      border-radius: 26px;
      padding: 24px 24px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      border: 2.5px solid var(--border);
      box-shadow: 0 10px 26px var(--shadow);
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .mini-card-wrap:hover .mini-face.front {
      border-color: var(--primary);
      box-shadow: 0 14px 32px rgba(255, 159, 28, 0.16);
    }

    /* Front of Mini Card: Big, Punchy, Inviting to Click */
    .mini-face.front {
      background: linear-gradient(160deg, #FFFFFF 0%, var(--bg-soft) 100%);
      align-items: center;
      text-align: center;
      justify-content: center;
      gap: 12px;
    }
    .mini-num-badge {
      position: absolute;
      top: 14px;
      left: 16px;
      width: 34px;
      height: 34px;
      border-radius: 50%;
      background: var(--banner-gradient);
      color: #fff;
      font-weight: 900;
      font-size: 1rem;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 10px var(--shadow);
    }
    .mini-emoji {
      font-size: 3.1rem;
      line-height: 1.1;
    }
    .mini-front-title {
      font-size: clamp(1.38rem, 2.2vw, 1.7rem);
      font-weight: 900;
      color: var(--text);
      margin: 0;
      line-height: 1.35;
    }
    .mini-front-sub {
      font-size: 1.02rem;
      font-weight: 700;
      color: var(--primary);
      background: #fff;
      padding: 4px 14px;
      border-radius: 40px;
      border: 1.5px solid var(--border);
    }
    .mini-tap-hint {
      position: absolute;
      bottom: 12px;
      right: 16px;
      font-size: 0.84rem;
      font-weight: 700;
      color: var(--muted);
    }

    /* Back of Mini Card: Big Clear Explanation */
    .mini-face.back {
      transform: rotateY(180deg);
      background: #FFFFFF;
      border-color: var(--primary);
      border-width: 3px;
      justify-content: flex-start;
      gap: 10px;
      overflow-y: auto;
    }
    .mini-back-head {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: clamp(1.22rem, 1.8vw, 1.45rem);
      font-weight: 900;
      color: var(--primary);
      padding-bottom: 8px;
      border-bottom: 2px dashed var(--border);
    }
    .mini-back-body {
      font-size: clamp(1.12rem, 1.6vw, 1.3rem);
      font-weight: 700;
      color: var(--text);
      line-height: 1.65;
      margin: 0;
    }
    .mini-back-note {
      margin-top: auto;
      background: var(--accent-soft);
      color: #0F766E;
      padding: 8px 13px;
      border-radius: 14px;
      font-size: 0.96rem;
      font-weight: 700;
    }

    /* Slide Action Bar */
    .slide-action-bar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding-top: 14px;
      border-top: 1.5px dashed var(--border);
    }
    .action-group { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }

    /* Lecturer Prompt Drawer (Optional expandable on stage) */
    .prompt-drawer {
      background: var(--bg-soft);
      border: 2px dashed var(--secondary);
      border-radius: 22px;
      padding: 18px 20px;
      margin-top: 4px;
      display: none;
    }
    .prompt-drawer.open { display: block; }
    .prompt-item {
      background: #fff;
      border: 1.5px solid var(--border);
      border-radius: 16px;
      padding: 13px 16px;
      margin-bottom: 10px;
    }
    .prompt-item:last-child { margin-bottom: 0; }
    .prompt-head {
      display: flex; align-items: center; justify-content: space-between;
      gap: 10px; flex-wrap: wrap; margin-bottom: 6px;
    }
    .prompt-label {
      font-size: 0.9rem; font-weight: 900; color: #0F766E;
      background: var(--accent-soft); padding: 4px 12px; border-radius: 40px;
    }
    .prompt-text {
      margin: 0; font-size: 1.05rem; font-weight: 700;
      color: var(--text); white-space: pre-wrap; line-height: 1.65;
    }

    /* Bottom Navigation & Chapter Strip */
    .stage-nav-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-top: 18px;
    }
    .thumb-strip {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding: 10px 2px 6px;
      margin-top: 10px;
      scrollbar-width: thin;
    }
    .thumb-item {
      flex: 0 0 100px;
      width: 100px;
      background: #fff;
      border: 2px solid var(--border);
      border-radius: 16px;
      padding: 9px 6px;
      cursor: pointer;
      text-align: center;
      transition: all 0.2s;
    }
    .thumb-item:hover { transform: translateY(-2px); border-color: var(--secondary); }
    .thumb-item.active {
      border-color: var(--primary);
      background: var(--bg-soft);
      box-shadow: 0 6px 16px var(--shadow);
    }
    .thumb-num { font-size: 0.76rem; font-weight: 900; color: var(--primary); }
    .thumb-title {
      font-size: 0.84rem; font-weight: 700; margin-top: 3px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }

    /* Student Solo-Card Mode (Strict Focus — Only Current Step!) */
    .solo-card {
      max-width: 680px;
      width: 100%;
      margin: 0 auto;
      background: #fff;
      border-radius: 28px;
      border: 2px solid var(--border);
      padding: 24px 20px;
      box-shadow: 0 12px 32px var(--shadow);
    }
    .solo-section {
      background: var(--bg-soft);
      border: 1.5px solid var(--border);
      border-radius: 20px;
      padding: 16px;
      margin-bottom: 14px;
    }
    .solo-section-title {
      font-size: 1rem; font-weight: 900; color: var(--primary);
      margin: 0 0 10px; display: flex; align-items: center; gap: 8px;
    }
    .step-chip {
      background: #fff; padding: 10px 14px; border-radius: 14px;
      font-size: 0.96rem; font-weight: 700; margin-bottom: 8px;
      border: 1px solid var(--border);
    }
    .step-chip:last-child { margin-bottom: 0; }

    /* Modals (QR & Lightbox) */
    .modal-backdrop {
      position: fixed; inset: 0; background: rgba(34, 28, 26, 0.76);
      backdrop-filter: blur(6px); display: none;
      align-items: center; justify-content: center; z-index: 200; padding: 18px;
    }
    .modal-backdrop.open { display: flex; }
    .modal-box {
      background: #fff; border-radius: 28px; max-width: 480px; width: 100%;
      padding: 26px 24px; text-align: center;
      box-shadow: 0 24px 60px rgba(0,0,0,0.3); position: relative;
      max-height: 92vh; overflow-y: auto;
    }
    .modal-box.wide { max-width: 960px; padding: 18px; }
    .modal-close {
      position: absolute; top: 14px; right: 14px; width: 38px; height: 38px;
      border-radius: 50%; border: none; background: var(--bg-soft);
      color: var(--text); font-size: 1.15rem; cursor: pointer;
    }
    .qr-tabs { display: flex; justify-content: center; gap: 6px; flex-wrap: wrap; margin: 12px 0 16px; }
    .qr-tab {
      padding: 6px 14px; border-radius: 40px; border: 1.5px solid var(--border);
      background: #fff; font-family: inherit; font-size: 0.86rem; font-weight: 700;
      cursor: pointer; color: var(--muted);
    }
    .qr-tab.active { background: var(--primary); color: #fff; border-color: var(--primary); }
    #qrCanvasWrap {
      display: inline-flex; flex-direction: column; align-items: center; gap: 6px;
      padding: 18px; background: #fff; border-radius: 22px;
      border: 3px solid var(--primary); box-shadow: 0 10px 26px var(--shadow); margin-bottom: 12px;
      cursor: zoom-in; transition: transform 0.18s ease;
    }
    #qrCanvasWrap:hover { transform: scale(1.03); }
    .qr-zoom-backdrop {
      position: fixed; inset: 0; background: rgba(25, 20, 18, 0.9);
      backdrop-filter: blur(8px); display: none;
      align-items: center; justify-content: center; flex-direction: column; gap: 16px;
      z-index: 500; padding: 20px; cursor: zoom-out;
    }
    .qr-zoom-backdrop.open { display: flex; }
    .qr-zoom-card {
      background: #fff; padding: 24px; border-radius: 30px;
      border: 5px solid var(--primary); box-shadow: 0 24px 64px rgba(0,0,0,0.45);
    }
    .qr-url-preview {
      font-size: 0.84rem; color: var(--muted); word-break: break-all;
      background: var(--bg-soft); padding: 8px 12px; border-radius: 12px; margin-bottom: 12px;
    }

    /* Toast */
    .toast {
      position: fixed; bottom: 24px; left: 50%;
      transform: translateX(-50%) translateY(90px);
      background: var(--text); color: #fff; padding: 12px 24px;
      border-radius: 40px; font-weight: 700; font-size: 0.98rem;
      box-shadow: 0 10px 28px rgba(0,0,0,0.25); opacity: 0;
      transition: all 0.25s ease; z-index: 300; max-width: 92vw; text-align: center;
    }
    .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }

    /* Footer */
    footer {
      text-align: center; padding: 22px 16px 26px; font-size: 0.92rem; color: #777;
      background: rgba(255, 255, 255, 0.82); border-top: 1.5px solid var(--border); margin-top: auto;
    }
    footer a { color: var(--primary); font-weight: 900; text-decoration: none; }
    footer a:hover { text-decoration: underline; }

    .hidden { display: none !important; }

    @media (max-width: 900px) {
      .mini-cards-grid.cols-3 { grid-template-columns: 1fr; }
      .mini-cards-grid.cols-2, .mini-cards-grid.cols-4 { grid-template-columns: 1fr; }
      .mini-card-wrap { min-height: 210px; }
      .slide-shell { padding: 20px 18px; }
      .theme-dots { display: none; }
    }
  </style>
</head>
<body>

  <!-- Navbar -->
  <header class="navbar">
    <div class="navbar-inner">
      <div class="brand">
        <div class="brand-icon"><i class="fa-solid fa-book-sparkles"></i></div>
        <div>
          <h1 class="brand-title">Puti-AI｜Gemini Notebook 減法工作術</h1>
        </div>
      </div>

      <div class="nav-actions" id="lecturerNav">
        <div class="theme-dots" title="切換日系暖心主題">
          <button class="theme-dot active" style="background:#FF9F1C" onclick="setTheme('warm', this)" aria-label="暖日橘"></button>
          <button class="theme-dot" style="background:#1B4965" onclick="setTheme('professional', this)" aria-label="清新藍"></button>
          <button class="theme-dot" style="background:#FF7597" onclick="setTheme('cute', this)" aria-label="櫻花粉"></button>
          <button class="theme-dot" style="background:#795548" onclick="setTheme('earth', this)" aria-label="大地褐"></button>
        </div>
        <button class="btn btn-white btn-icon" id="soundToggle" onclick="toggleSound()" title="音效開關" aria-label="音效開關">
          <i class="fa-solid fa-volume-high"></i>
        </button>
        <a class="btn btn-soft btn-icon" href="icebreaker.html" title="課前破冰即時牆" aria-label="課前破冰即時牆">
          <i class="fa-solid fa-fire"></i>
        </a>
        <a class="btn btn-soft btn-icon" href="live.html" title="現場即時提示詞黑板" aria-label="現場即時提示詞黑板">
          <i class="fa-solid fa-bolt"></i>
        </a>
        <button class="btn btn-padlet btn-icon" onclick="openQrModal('padlet')" title="Padlet 成果驗收 QR Code（P）" aria-label="Padlet 成果驗收 QR Code">
          <i class="fa-solid fa-thumbtack"></i>
        </button>
        <button class="btn btn-primary btn-icon" id="navQrBtn" onclick="openQrModal('card')" title="顯示本關 QR Code（Q）" aria-label="顯示本關 QR Code">
          <i class="fa-solid fa-qrcode"></i>
        </button>
        <a class="btn btn-accent btn-icon" href="https://notebooklm.google.com/" target="_blank" rel="noopener noreferrer" title="開啟 Gemini Notebook" aria-label="開啟 Gemini Notebook">
          <i class="fa-solid fa-arrow-up-right-from-square"></i>
        </a>
      </div>
    </div>
  </header>

  <main>
    <!-- LECTURER INTERACTIVE SLIDE STAGE -->
    <section id="stageView">
      <div class="slide-shell" id="slideShell"></div>

      <div class="stage-nav-row">
        <div class="action-group">
          <button class="btn btn-white" id="btnPrev" onclick="prevSlide()">
            <i class="fa-solid fa-chevron-left"></i> 上一頁
          </button>
          <button class="btn btn-soft" onclick="flipAllMiniCards(true)">
            <i class="fa-solid fa-layer-group"></i> 全部翻開
          </button>
          <button class="btn btn-soft" onclick="flipAllMiniCards(false)">
            <i class="fa-solid fa-rotate-left"></i> 全部蓋上
          </button>
          <button class="btn btn-white" id="btnNext" onclick="nextSlide()">
            下一頁 <i class="fa-solid fa-chevron-right"></i>
          </button>
        </div>
        <div class="action-group" style="font-size:0.86rem; color:var(--muted); font-weight:700;">
          1~4 翻卡｜← → 換頁｜Q 顯示 QR
        </div>
      </div>

      <div class="thumb-strip" id="thumbStrip"></div>
    </section>

    <!-- STUDENT SOLO-CARD VIEW (Strict Focus Mode via ?card=X) -->
    <section id="soloView" class="hidden"></section>
  </main>

  <!-- QR Code Modal (Strict Single-Step Only!) -->
  <div class="modal-backdrop" id="qrModal" onclick="closeModalOnBackdrop(event, 'qrModal')">

    // =========================================================================
    // State & Utilities
    // =========================================================================
    let currentIndex = 0;
    let soundEnabled = true;
    let qrTarget = 'card';
    let qrModalSlideId = 1;
    let audioCtx = null;

    function getBaseUrl() {
      const href = window.location.href.split('#')[0].split('?')[0];
      return href.substring(0, href.lastIndexOf('/') + 1);
    }

    function getSourceFullUrl(relUrl) {
      return getBaseUrl() + relUrl;
    }

    function getSoloLink(slideId) {
      if (window.location.protocol === 'file:') {
        return window.location.href.split('?')[0].split('#')[0] + '?card=' + slideId;
      }
      return getBaseUrl() + '?card=' + slideId;
    }

    function playTone(type) {
      if (!soundEnabled) return;
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const now = audioCtx.currentTime;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);

        if (type === 'flip') {
          osc.type = 'sine';
          osc.frequency.setValueAtTime(360, now);
          osc.frequency.exponentialRampToValueAtTime(540, now + 0.08);
          gain.gain.setValueAtTime(0.06, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.11);
          osc.start(now); osc.stop(now + 0.12);
        } else if (type === 'copy') {
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(587.33, now);
          osc.frequency.setValueAtTime(880, now + 0.07);
          gain.gain.setValueAtTime(0.07, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.22);
          osc.start(now); osc.stop(now + 0.23);
        } else {
          osc.type = 'sine';
          osc.frequency.setValueAtTime(440, now);
          gain.gain.setValueAtTime(0.04, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.06);
          osc.start(now); osc.stop(now + 0.07);
        }
      } catch (e) {}
    }

    function toggleSound() {
      soundEnabled = !soundEnabled;
      document.getElementById('soundToggle').innerHTML = soundEnabled
        ? '<i class="fa-solid fa-volume-high"></i>'
        : '<i class="fa-solid fa-volume-xmark"></i>';
    }

    function showToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.add('show');
      clearTimeout(window._toastTimer);
      window._toastTimer = setTimeout(() => t.classList.remove('show'), 2300);
    }

    function copyText(text, successMsg) {
      const done = () => {
        playTone('copy');
        showToast(successMsg || '✅ 已複製！請切回 NotebookLM 直接貼上');
      };
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(done).catch(() => fallbackCopy(text, done));
      } else {
        fallbackCopy(text, done);
      }
    }

    function fallbackCopy(text, cb) {
      const ta = document.createElement('textarea');
      ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta); ta.select();
      document.execCommand('copy');
      document.body.removeChild(ta); cb();
    }

    function setTheme(theme, el) {
      document.documentElement.setAttribute('data-theme', theme);
      localStorage.setItem('puti_1124_theme', theme);
      document.querySelectorAll('.theme-dot').forEach(d => d.classList.remove('active'));
      if (el) el.classList.add('active');
    }

    function escapeHtml(str) {
      return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }

    // =========================================================================
    // Render Lecturer Interactive Slide (Header + Clickable Mini Flip Cards)
    // =========================================================================
    function renderSlide() {
      const slide = slideData[currentIndex];
      const hasPractice = !!(slide.source || (slide.prompts && slide.prompts.length));
      const colsClass = 'cols-' + slide.cards.length;

      document.getElementById('btnPrev').disabled = currentIndex === 0;
      document.getElementById('btnNext').disabled = currentIndex === slideData.length - 1;
      document.getElementById('navQrBtn').classList.toggle('hidden', !hasPractice);

      if (history.replaceState) {
        history.replaceState(null, '', '#slide-' + slide.id);
      }

      const miniCardsHtml = slide.cards.map((c, idx) => `
        <div class="mini-card-wrap" id="mini-card-${idx}" onclick="toggleMiniCard(${idx})">
          <div class="mini-card-inner">
            <div class="mini-face front">
              <span class="mini-num-badge">${idx + 1}</span>
              <div class="mini-emoji">${c.emoji}</div>
              <h3 class="mini-front-title">${c.frontTitle}</h3>
              <span class="mini-front-sub">${c.frontSub}</span>
              <span class="mini-tap-hint"><i class="fa-solid fa-hand-pointer"></i> 點擊翻面</span>
            </div>
            <div class="mini-face back">
              <div class="mini-back-head">
                <span>${c.emoji}</span>
                <span>${c.frontTitle}</span>
              </div>
              <p class="mini-back-body">${c.backBody}</p>
              ${c.backNote ? `<div class="mini-back-note">${c.backNote}</div>` : ''}
            </div>
          </div>
        </div>
      `).join('');

      const clipBtn = slide.clipping
        ? `<button class="btn btn-soft btn-sm" onclick="openImgModal('${slide.clipping.img}', '${slide.clipping.title}')">
             <i class="fa-regular fa-newspaper"></i> 國語日報原版剪報
           </button>`
        : '';

      const practiceBtns = hasPractice
        ? `<button class="btn btn-white btn-sm" onclick="togglePromptDrawer()">
             <i class="fa-regular fa-eye"></i> 檢視本關提示詞
           </button>
           <button class="btn btn-padlet btn-sm" onclick="openQrModal('padlet')">
             <i class="fa-solid fa-thumbtack"></i> Padlet QR（${slide.code} ${slide.shortTitle}）
           </button>
           <button class="btn btn-primary" onclick="openQrModal('card')">
             <i class="fa-solid fa-qrcode"></i> 顯示本關 QR Code
           </button>`
        : `<span style="font-size:0.92rem; font-weight:700; color:var(--muted);">點擊上方卡片展開說明</span>`;

      let drawerHtml = '';
      if (hasPractice) {
        const srcPart = slide.source ? `
          <div style="display:flex; flex-wrap:wrap; gap:8px; margin-bottom:12px;">
            <button class="btn btn-accent btn-sm" onclick="copySourceUrl('${slide.source.relUrl}')">
              <i class="fa-solid fa-link"></i> 複製教材網址
            </button>
            <button class="btn btn-white btn-sm" onclick="copyFullText('${slide.source.fullTextKey}')">
              <i class="fa-regular fa-paste"></i> 複製教材全文
            </button>
            <a class="btn btn-soft btn-sm" href="${slide.source.relUrl}" target="_blank" rel="noopener noreferrer">
              <i class="fa-regular fa-file-lines"></i> 檢視教材頁
            </a>
          </div>
        ` : '';

        const prmPart = (slide.prompts || []).map((p, pIdx) => `
          <div class="prompt-item">
            <div class="prompt-head">
              <span class="prompt-label">${p.label}</span>
              <button class="btn btn-primary btn-sm" onclick="copySlidePrompt(${slide.id}, ${pIdx})">
                <i class="fa-regular fa-copy"></i> 一鍵複製
              </button>
            </div>
            <p class="prompt-text">${escapeHtml(p.text)}</p>
          </div>
        `).join('');

        drawerHtml = `<div class="prompt-drawer" id="promptDrawer">${srcPart}${prmPart}</div>`;
      }

      document.getElementById('slideShell').innerHTML = `
        <div class="slide-meta-row">
          <span class="tag-pill ${slide.session}">${slide.sessionName}</span>
          <span class="slide-progress">第 ${currentIndex + 1} / ${slideData.length} 頁</span>
        </div>
        <h2 class="slide-title">${slide.title}</h2>
        <p class="slide-quote">${slide.quote}</p>

        <div class="mini-cards-grid ${colsClass}">
          ${miniCardsHtml}
        </div>

        <div class="slide-action-bar">
          <div class="action-group">${clipBtn}</div>
          <div class="action-group">${practiceBtns}</div>
        </div>
        ${drawerHtml}
      `;

      renderThumbs();
    }

    function toggleMiniCard(idx) {
      const el = document.getElementById('mini-card-' + idx);
      if (!el) return;
      el.classList.toggle('flipped');
      playTone('flip');
    }

    function flipAllMiniCards(open) {
      document.querySelectorAll('.mini-card-wrap').forEach(el => {
        el.classList.toggle('flipped', open);
      });
      playTone('flip');
    }

    function togglePromptDrawer() {
      const d = document.getElementById('promptDrawer');
      if (d) d.classList.toggle('open');
    }

    function renderThumbs() {
      const strip = document.getElementById('thumbStrip');
      const iceBtn = `
        <a class="thumb-item" href="icebreaker.html" style="text-decoration:none; color:inherit; border-color:var(--primary); background:var(--bg-soft);" title="課前破冰即時心聲牆">
          <div class="thumb-num">00 🔥</div>
          <div class="thumb-title">課前破冰</div>
        </a>
      `;
      const liveBtn = `
        <a class="thumb-item" href="live.html" style="text-decoration:none; color:inherit; border-color:var(--accent); background:var(--accent-soft);" title="現場即時提示詞黑板">
          <div class="thumb-num" style="color:#0F766E;">⚡ 即時</div>
          <div class="thumb-title">即時黑板</div>
        </a>
      `;
      strip.innerHTML = iceBtn + slideData.map((s, idx) => {
        const hasPractice = !!(s.source || (s.prompts && s.prompts.length));
        return `
          <button class="thumb-item ${idx === currentIndex ? 'active' : ''}" onclick="goToSlide(${idx})" title="${s.title}">
            <div class="thumb-num">${s.code} ${hasPractice ? '📱' : '💡'}</div>
            <div class="thumb-title">${s.shortTitle}</div>
          </button>
        `;
      }).join('') + liveBtn;
      const activeEl = strip.querySelector('.thumb-item.active');
      if (activeEl) activeEl.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
    }

    function goToSlide(idx) {
      currentIndex = Math.max(0, Math.min(slideData.length - 1, idx));
      playTone('tick');
      renderSlide();
    }
    function prevSlide() { if (currentIndex > 0) goToSlide(currentIndex - 1); }
    function nextSlide() { if (currentIndex < slideData.length - 1) goToSlide(currentIndex + 1); }

      } else if (slide.id >= 14 && slide.id <= 15) {
        reqSourceLabel = '沿用「教材 B：115 計畫＋公文＋雜記」筆記本';
        fallbackSource = { title: '教材 B：115 計畫＋公文＋雜記', relUrl: 'sources/plan115.html', fullTextKey: 'plan115' };
      } else if (slide.id === 16) {
        reqSourceLabel = '自備資料（回校上傳：去年舊簡報 PDF ＋ 本學期計畫）';
      }

      const activeSource = slide.source || fallbackSource;
      const sourceHtml = slide.source ? `
        <div class="solo-section">
          <div class="solo-section-title"><i class="fa-solid fa-folder-open"></i> 步驟一：複製本關教材</div>
          <p style="margin:0 0 10px; font-size:0.94rem; color:var(--muted); font-weight:700;">${slide.source.title}</p>
          <div style="display:grid; gap:10px;">
            <button class="btn btn-accent" style="width:100%; padding:13px 16px; font-size:1rem;" onclick="copySourceUrl('${slide.source.relUrl}')">
              <i class="fa-solid fa-link"></i> 複製教材網址（貼網站來源）
            </button>
            <button class="btn btn-white" style="width:100%; padding:12px 16px; font-size:0.96rem;" onclick="copyFullText('${slide.source.fullTextKey}')">
              <i class="fa-regular fa-paste"></i> 複製教材全文（貼文字來源）
            </button>
          </div>
        </div>
      ` : (activeSource ? `
        <div class="solo-section">
          <div class="solo-section-title"><i class="fa-solid fa-folder-open"></i> 還沒匯入教材嗎？點此補複製</div>
          <div style="display:flex; gap:8px; flex-wrap:wrap;">
            <button class="btn btn-accent btn-sm" style="flex:1;" onclick="copySourceUrl('${activeSource.relUrl}')">
              <i class="fa-solid fa-link"></i> 複製教材網址
            </button>
            <button class="btn btn-white btn-sm" style="flex:1;" onclick="copyFullText('${activeSource.fullTextKey}')">
              <i class="fa-regular fa-paste"></i> 複製教材全文
            </button>
          </div>
        </div>
      ` : '');

      const promptsHtml = (slide.prompts || []).map((p, idx) => `
        <div class="prompt-item">
          <div class="prompt-head">
            <span class="prompt-label">${p.label}</span>
          </div>
          <p class="prompt-text">${escapeHtml(p.text)}</p>
          <button class="btn btn-primary" style="width:100%; padding:13px 18px; font-size:1.02rem; margin-top:8px;" onclick="copySlidePrompt(${slide.id}, ${idx})">
            <i class="fa-regular fa-copy"></i> 一鍵複製提示詞
          </button>
        </div>
      `).join('');

      solo.innerHTML = `
        <div class="solo-card">
          <div class="slide-meta-row" style="margin-bottom:10px;">
            <span class="tag-pill ${slide.session}">${slide.sessionName}</span>
            <span class="slide-progress">第 ${slide.code} 關實作包</span>
          </div>
          <h2 style="font-size:1.48rem; font-weight:900; margin:6px 0 8px; line-height:1.35;">${slide.title}</h2>
          <div style="background:var(--accent-soft); color:#0F766E; border:1.5px solid #B2EBF2; border-radius:14px; padding:8px 13px; font-size:0.9rem; font-weight:700; margin-bottom:14px;">
            📦 所需來源：${reqSourceLabel}
          </div>

          ${stepsHtml ? `
            <div class="solo-section">
              <div class="solo-section-title"><i class="fa-solid fa-list-check"></i> 實作三步驟</div>
              ${stepsHtml}
            </div>
          ` : ''}

          ${sourceHtml}

          ${promptsHtml ? `
            <div class="solo-section">
              <div class="solo-section-title"><i class="fa-solid fa-comment-dots"></i> 複製提示詞</div>
              ${promptsHtml}
            </div>
          ` : ''}

          <div style="display:grid; gap:10px;">
            <a class="btn btn-dark" style="width:100%; padding:14px 18px; font-size:1.04rem;" href="https://notebooklm.google.com/" target="_blank" rel="noopener noreferrer">
              <i class="fa-solid fa-arrow-up-right-from-square"></i> 開啟 Gemini Notebook
            </a>
            <a class="btn btn-padlet" style="width:100%; padding:14px 18px; font-size:1.02rem;" href="https://padlet.com/clongwh/1124" target="_blank" rel="noopener noreferrer">
              <i class="fa-solid fa-thumbtack"></i> 到 Padlet 貼文驗收（貼至「${slide.code} ${slide.shortTitle}」欄）
            </a>
          </div>
        </div>
      `;
    }

    // =========================================================================
    // Copy & QR Helpers
    // =========================================================================
    function copySlidePrompt(slideId, pIdx) {
      const s = slideData.find(x => x.id === slideId);
      if (!s || !s.prompts || !s.prompts[pIdx]) return;
      copyText(s.prompts[pIdx].text, '✅ 提示詞已複製！請貼入 Gemini Notebook');
    }

    function copySourceUrl(relUrl) {
      copyText(getSourceFullUrl(relUrl), '✅ 教材網址已複製！請貼入「新增來源 → 網站」');
    }

    function copyFullText(key) {
      if (!FULL_TEXT_SOURCES[key]) return;
      copyText(FULL_TEXT_SOURCES[key], '✅ 教材全文已複製！請貼入「新增來源 → 複製的文字」');
    }

    const PADLET_URL = 'https://padlet.com/clongwh/1124';

    function openQrModal(target = 'card') {
      const slide = slideData[currentIndex];
      const hasPractice = !!(slide.source || (slide.prompts && slide.prompts.length));
      qrModalSlideId = slide.id;
      qrTarget = target;
      document.getElementById('qrTabCard').classList.toggle('hidden', !hasPractice);
      document.getElementById('qrTabSource').classList.toggle('hidden', !slide.source);
      document.getElementById('qrModal').classList.add('open');
      renderQrCode();
    }

    function switchQrTarget(target) {
      qrTarget = target;
      renderQrCode();
    }

    function getActiveQrUrl() {
      const slide = slideData.find(s => s.id === qrModalSlideId) || slideData[0];
      if (qrTarget === 'padlet') return PADLET_URL;
      if (qrTarget === 'source' && slide.source) return getSourceFullUrl(slide.source.relUrl);
      return getSoloLink(slide.id);
    }

    function renderQrCode() {
      const slide = slideData.find(s => s.id === qrModalSlideId) || slideData[0];
      const url = getActiveQrUrl();

      document.getElementById('qrTabCard').classList.toggle('active', qrTarget === 'card');
      document.getElementById('qrTabSource').classList.toggle('active', qrTarget === 'source');
      document.getElementById('qrTabPadlet').classList.toggle('active', qrTarget === 'padlet');

      if (qrTarget === 'padlet') {
        const hasPractice = !!(slide.source || (slide.prompts && slide.prompts.length));
        document.getElementById('qrModalTitle').textContent = hasPractice
          ? `📌 Padlet 驗收｜請貼至「${slide.code} ${slide.shortTitle}」欄`
          : '📌 Padlet 成果驗收牆';
        document.getElementById('qrModalDesc').textContent = '請掃描 QR Code 進入 Padlet 貼上你的實作成果';
      } else if (qrTarget === 'source' && slide.source) {
        document.getElementById('qrModalTitle').textContent = `📄 ${slide.source.title}`;
        document.getElementById('qrModalDesc').textContent = '請掃描開啟教材頁面，或複製網址貼入 Gemini Notebook';
      } else {
        document.getElementById('qrModalTitle').textContent = `🎯 第 ${slide.code} 關｜${slide.title}`;
        document.getElementById('qrModalDesc').textContent = '掃碼開啟本關實作包，依畫面一鍵複製即可';
      }

      document.getElementById('qrUrlText').textContent = url;
      document.getElementById('qrOpenLinkBtn').href = url;
      const box = document.getElementById('qrCodeBox');
      box.innerHTML = '';
      new QRCode(box, {
        text: url,
        width: 268,
        height: 268,
        colorDark: '#221C1A',
        colorLight: '#FFFFFF',
        correctLevel: QRCode.CorrectLevel.M
      });
    }

    function copyCurrentQrUrl() {
      copyText(getActiveQrUrl(), '✅ 已複製 QR Code 對應網址！');
    }

    function openQrZoom() {
      const url = getActiveQrUrl();
      const box = document.getElementById('qrZoomBox');
      box.innerHTML = '';
      const size = Math.min(Math.floor(window.innerWidth * 0.72), Math.floor(window.innerHeight * 0.68), 520);
      new QRCode(box, {
        text: url,
        width: size,
        height: size,
        colorDark: '#221C1A',
        colorLight: '#FFFFFF',
        correctLevel: QRCode.CorrectLevel.M
      });
      document.getElementById('qrZoomCaption').textContent = document.getElementById('qrModalTitle').textContent + '（點擊任意處縮小）';
      document.getElementById('qrZoomModal').classList.add('open');
    }

    function closeQrZoom() {
      document.getElementById('qrZoomModal').classList.remove('open');
    }

    function openImgModal(imgSrc, title) {
      document.getElementById('imgModalSrc').src = imgSrc;
      document.getElementById('imgModalTitle').textContent = title;
      document.getElementById('imgModal').classList.add('open');
    }

    function closeModal(id) { document.getElementById(id).classList.remove('open'); }
    function closeModalOnBackdrop(e, id) { if (e.target.id === id) closeModal(id); }

    // =========================================================================
    // Keyboard Shortcuts
    // =========================================================================
    document.addEventListener('keydown', (e) => {
      if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
      if (e.key === 'Escape') { closeQrZoom(); closeModal('qrModal'); closeModal('imgModal'); return; }
      if (document.getElementById('qrModal').classList.contains('open') ||
          document.getElementById('imgModal').classList.contains('open')) return;
      if (!document.getElementById('soloView').classList.contains('hidden')) return;

      if (e.key === 'ArrowRight') { e.preventDefault(); nextSlide(); }
      else if (e.key === 'ArrowLeft') { e.preventDefault(); prevSlide(); }
      else if (e.key === 'p' || e.key === 'P') {
        e.preventDefault();
        openQrModal('padlet');
      } else if (e.key === 'q' || e.key === 'Q') {
        const s = slideData[currentIndex];
        if (s.source || (s.prompts && s.prompts.length)) {
          e.preventDefault();
          openQrModal('card');
        }
      } else if (['1', '2', '3', '4'].includes(e.key)) {
        const idx = parseInt(e.key, 10) - 1;
        toggleMiniCard(idx);
      }
    });

    // =========================================================================
    // Init
    // =========================================================================
    (function init() {
      const savedTheme = localStorage.getItem('puti_1124_theme');
      if (savedTheme) {
        document.documentElement.setAttribute('data-theme', savedTheme);
        const map = { warm: 0, professional: 1, cute: 2, earth: 3 };
        const dots = document.querySelectorAll('.theme-dot');
        dots.forEach(d => d.classList.remove('active'));
        if (dots[map[savedTheme]]) dots[map[savedTheme]].classList.add('active');
      }

      // Strict Solo-Card Mode for Students scanning QR Code (?card=X)
      const params = new URLSearchParams(window.location.search);
      const soloParam = params.get('card');
      if (soloParam) {
        const soloId = parseInt(soloParam, 10);
        if (!isNaN(soloId)) {
          renderSoloCard(soloId);
          return;
        }
      }

      const applyHash = () => {
        const hashMatch = window.location.hash.match(/slide-(\d+)/);
        if (hashMatch) {
          const idx = slideData.findIndex(s => s.id === parseInt(hashMatch[1], 10));
          if (idx >= 0 && idx !== currentIndex) {
            currentIndex = idx;
            renderSlide();
          }
        }
      };

      const hashMatch = window.location.hash.match(/slide-(\d+)/);
      if (hashMatch) {
        const idx = slideData.findIndex(s => s.id === parseInt(hashMatch[1], 10));
        if (idx >= 0) currentIndex = idx;
      }

      window.addEventListener('hashchange', applyHash);
      renderSlide();
    })();
  </script>
</body>
</html>
